name: Bug report
description: Something on the room server doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security problems, don't open an issue: see SECURITY.md.
        For problems in the app itself (UI, playback), use the Spotube repository.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a room on …
        2. Join from a second device …
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: Spotube's public server, or your own deployment (and its commit)?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Spotube version and platform
      placeholder: e.g. 5.0.0 on Android 16
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant `wrangler tail` or app logs. Remove room codes and names.
      render: text
