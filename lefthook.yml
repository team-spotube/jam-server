pre-commit:
  parallel: true
  commands:
    # Every source file carries the AGPL header (.github/agpl_header.txt).
    agpl-headers:
      glob: "*.{ts,mts,js,mjs,jsonc,yml,yaml,go}"
      exclude:
        - worker-configuration.d.ts
        - pnpm-lock.yaml
      run: node scripts/license-header.mjs {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,jsonc}"
      run: pnpm exec tsc --noEmit
